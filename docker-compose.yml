# GLA stack — production deployment.
#
# The database is a single SQLite file in the gla-data volume; score files
# live in the bind-mounted ./storage folder. There is no database service.
#
# Platforms: the three services are pinned to linux/arm64 (the deployment
# target). Next to each sits a commented `platform: linux/amd64` line to
# swap in for dev testing on x86 hosts.
#
# Settings & secrets are read from .env (gitignored) — copy .env.example
# to .env first.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gla-backend
    container_name: gla-backend
    platform: linux/arm64
    # platform: linux/amd64   # x86 dev/testing — swap with the line above
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # SQLite file in the gla-data volume; EF migrations (and the seed
      # songs) run against it on startup.
      ConnectionStrings__GlaDb: "Data Source=/data/gla.db"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN:-http://localhost}"
      Songs__FilesRoot: /app/storage
    volumes:
      # Database (named volume) and score files (host folder) both persist.
      - gla-data:/data
      - ./storage:/app/storage
    # Not published to the host — nginx reaches it as http://backend:8080
    # over the compose network.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gla-frontend
    container_name: gla-frontend
    platform: linux/arm64
    # platform: linux/amd64   # x86 dev/testing — swap with the line above
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gla-cloudflared
    platform: linux/arm64
    # platform: linux/amd64   # x86 dev/testing — swap with the line above
    restart: unless-stopped
    # Remotely-managed tunnel: route the public hostname to http://frontend:80
    # in the Cloudflare dashboard (Zero Trust -> Tunnels).
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:?Set CF_TUNNEL_TOKEN in .env - copy .env.example first}
    depends_on:
      - frontend

volumes:
  gla-data:
