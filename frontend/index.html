<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon set from public/favicon_io/: ICO for legacy browsers, PNG
         fallbacks, Apple touch icon, and the PWA manifest (its icons are
         served from /favicon_io/ too). -->
    <link rel="icon" href="/favicon_io/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon_io/site.webmanifest" />
    <!-- viewport-fit=cover: let the page reach under the notch / home
         indicator so the score can be full-bleed; the chrome bars pad
         themselves clear of those areas via env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Link previews in messengers (Telegram, WhatsApp, Discord, …).
         og:image must be an absolute URL — a relative path silently drops
         the picture from the card. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gla.orbitalgarden.net/" />
    <meta property="og:title" content="GLA — Guitar Learning App" />
    <meta property="og:description" content="Upload a guitar tab and learn the song chunk by chunk." />
    <meta property="og:image" content="https://gla.orbitalgarden.net/meta.png" />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta name="twitter:card" content="summary" />
    <title>GLA</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
