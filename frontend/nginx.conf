# GLA production front door.
# - Serves the built SPA from /usr/share/nginx/html with SPA fallback, so deep
#   links like /songs/1 survive a refresh.
# - Proxies /api/* to the backend with the prefix stripped — the exact
#   contract of the Vite dev proxy (vite.config.ts), so the app stays
#   same-origin and CORS never comes into play.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Uploads travel through this proxy; .capx/.musicxml files can exceed
    # nginx's 1 MB default request body limit.
    client_max_body_size 32m;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # index.html is the deploy manifest — never cache it, or a new build gets
    # served with stale /assets/ hashes. try_files rewrites every SPA route to
    # /index.html internally, so this location covers them all.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed files under /assets/ — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API → backend, prefix stripped (mirrors the Vite dev proxy).
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: anything else renders index.html (Vue Router takes over).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
